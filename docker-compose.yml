version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: cmd/Dockerfile
    expose:
      - "8080"        # exposed to other containers
    networks:
      - socialnet

  frontend:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - socialnet

networks:
  socialnet:
    driver: bridge
