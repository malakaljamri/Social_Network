version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: cmd/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./forum.db:/app/forum.db
    networks:
      - socialnet

  frontend:
    build:
      context: ./web
    ports:
      - "3000:80"
    networks:
      - socialnet

networks:
  socialnet:
    driver: bridge
